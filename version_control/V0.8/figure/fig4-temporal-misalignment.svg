<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500"
     font-family="Inter, Helvetica Neue, Arial, sans-serif">

  <!--
    NON-LINEAR year widths:
    2022: 100px  (x: 80-180)
    2023: 120px  (x: 180-300)
    2024: 200px  (x: 300-500)
    2025: 460px  (x: 500-960)
    2026: 120px  (x: 960-1080)

    Track positions (wide spacing):
    Cap:  y=85
    Def:  y=255  (170px gap)
    Gov:  y=405  (150px gap)

    Gap arc: routed FAR RIGHT (x=1100+) to avoid all event nodes and text.
    Gap label: positioned at x=1095 between Cap and Def (y=155).
  -->

  <rect width="1150" height="500" fill="#FFFFFF"/>
  <text x="575" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A">Temporal Misalignment: Capability, Defense, and Governance</text>

  <!-- Year grid (non-equal widths) -->
  <g id="grid">
    <line x1="80"  y1="44" x2="80"  y2="450" stroke="#F0F0F0" stroke-width="1.5"/>
    <line x1="180" y1="44" x2="180" y2="450" stroke="#F0F0F0" stroke-width="1.5"/>
    <line x1="300" y1="44" x2="300" y2="450" stroke="#F0F0F0" stroke-width="1.5"/>
    <line x1="500" y1="44" x2="500" y2="450" stroke="#F0F0F0" stroke-width="1.5"/>
    <line x1="960" y1="44" x2="960" y2="450" stroke="#F0F0F0" stroke-width="1.5"/>
    <line x1="1080" y1="44" x2="1080" y2="450" stroke="#F0F0F0" stroke-width="1.5"/>
    <text x="130"  y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#9E9E9E">2022</text>
    <text x="240"  y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#9E9E9E">2023</text>
    <text x="400"  y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#9E9E9E">2024</text>
    <text x="730"  y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#616161">2025</text>
    <text x="1020" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#9E9E9E">2026</text>
    <!-- 2025 subtle highlight band -->
    <rect x="500" y="44" width="460" height="406" fill="#FAFAFA"/>
  </g>

  <!-- Cross-track dashed connectors (behind nodes) -->
  <g id="cross-track" fill="none">
    <line x1="490" y1="100" x2="550" y2="240" stroke="#BDBDBD" stroke-width="1.5" stroke-dasharray="5 3"/>
    <line x1="580" y1="270" x2="890" y2="390" stroke="#BDBDBD" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>

  <!-- 14-MONTH GAP ARC — routed far right, outside all events -->
  <g id="gap-arc">
    <!--
      Arc path: MCP (490, 85) → curves out to x=1110 → down to IMDA (990, 405)
      Control points at x=1110 keep arc entirely to the right of all event nodes.
      NIST is at x=1040, arc passes at x=1110 → 70px clearance.
    -->
    <path d="M 490 85 C 1110 85, 1110 405, 990 405"
          stroke="#E53935" stroke-width="3" stroke-dasharray="7 4" fill="none"/>
    <!-- Label: between Cap and Def tracks, on the right side of the arc -->
    <rect x="1074" y="215" width="60" height="72" rx="6" fill="#FFF" stroke="#E53935" stroke-width="2"/>
    <text x="1104" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#B71C1C">14</text>
    <text x="1104" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">month</text>
    <text x="1104" y="270" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">gap</text>
    <!-- Small arrows at arc endpoints pointing to MCP and IMDA -->
    <circle cx="490" cy="85" r="4" fill="#E53935"/>
    <circle cx="990" cy="405" r="4" fill="#E53935"/>
  </g>

  <!-- ====== TRACK 1: Capability (blue) y=85 ====== -->
  <g id="capability">
    <rect x="2" y="70" width="72" height="30" rx="6" fill="#2196F3"/>
    <text x="38" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">Capability</text>
    <line x1="76" y1="85" x2="1080" y2="85" stroke="#2196F3" stroke-width="2.5"/>

    <!-- ChatGPT Nov 2022 → x=155 -->
    <circle cx="155" cy="85" r="10" fill="#BBDEFB" stroke="#2196F3" stroke-width="2"/>
    <text x="155" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">ChatGPT</text>
    <text x="155" y="113" text-anchor="middle" font-size="11" fill="#757575">Nov 22</text>

    <!-- GPT-4 Mar 2023 → x=210 -->
    <circle cx="210" cy="85" r="9" fill="#BBDEFB" stroke="#2196F3" stroke-width="2"/>
    <text x="210" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">GPT-4</text>
    <text x="210" y="113" text-anchor="middle" font-size="11" fill="#757575">Mar 23</text>

    <!-- Llama Jul 2023 → x=260 -->
    <circle cx="260" cy="85" r="8" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
    <text x="260" y="66" text-anchor="middle" font-size="12" fill="#0D47A1">Llama</text>
    <text x="260" y="113" text-anchor="middle" font-size="11" fill="#757575">Jul 23</text>

    <!-- Computer Use Oct 2024 → x=440 -->
    <circle cx="440" cy="85" r="8" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
    <text x="440" y="66" text-anchor="middle" font-size="12" fill="#0D47A1">Computer Use</text>
    <text x="440" y="113" text-anchor="middle" font-size="11" fill="#757575">Oct 24</text>

    <!-- MCP launch Nov 2024 → x=490 KEY EVENT -->
    <circle cx="490" cy="85" r="14" fill="#2196F3" stroke="#0D47A1" stroke-width="2.5"/>
    <text x="490" y="55" text-anchor="middle" font-size="14" font-weight="800" fill="#0D47A1">MCP launch</text>
    <text x="490" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#424242">Nov 2024</text>

    <!-- Operator Jan 2025 → x=520 -->
    <circle cx="530" cy="85" r="8" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
    <text x="530" y="66" text-anchor="middle" font-size="11" fill="#0D47A1">Operator</text>

    <!-- Claude Code May 2025 → x=660 -->
    <circle cx="660" cy="85" r="8" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
    <text x="660" y="66" text-anchor="middle" font-size="11" fill="#0D47A1">Claude Code</text>
    <text x="660" y="113" text-anchor="middle" font-size="11" fill="#757575">May 25</text>

    <!-- Codex Aug 2025 → x=810 -->
    <circle cx="810" cy="85" r="8" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
    <text x="810" y="66" text-anchor="middle" font-size="11" fill="#0D47A1">Codex</text>
    <text x="810" y="113" text-anchor="middle" font-size="10" fill="#757575">1.6M users</text>
  </g>

  <!-- ====== TRACK 2: Defense (green) y=255 ====== -->
  <g id="defense">
    <rect x="2" y="240" width="72" height="30" rx="6" fill="#4CAF50"/>
    <text x="38" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">Defense</text>
    <line x1="76" y1="255" x2="1080" y2="255" stroke="#4CAF50" stroke-width="2.5"/>

    <!-- OAuth 2.1 Mar 2025 → x=550 -->
    <circle cx="550" cy="255" r="10" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
    <text x="550" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#1B5E20">OAuth 2.1</text>
    <text x="550" y="283" text-anchor="middle" font-size="11" fill="#757575">Mar 25</text>

    <!-- Tool poison Apr 2025 → x=600 -->
    <circle cx="600" cy="255" r="9" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="600" y="300" text-anchor="middle" font-size="12" fill="#1B5E20">Tool poison</text>
    <text x="600" y="314" text-anchor="middle" font-size="11" fill="#757575">Apr 25</text>

    <!-- ETDI Jun 2025 → x=680 -->
    <circle cx="680" cy="255" r="10" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
    <text x="680" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#1B5E20">ETDI</text>
    <text x="680" y="283" text-anchor="middle" font-size="11" fill="#757575">Jun 25</text>

    <!-- MCPTox Aug 2025 → x=760 -->
    <circle cx="760" cy="255" r="9" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="760" y="236" text-anchor="middle" font-size="12" fill="#1B5E20">MCPTox</text>
    <text x="760" y="283" text-anchor="middle" font-size="11" fill="#757575">Aug 25</text>

    <!-- Circuit Breakers Sep 2025 → x=830 -->
    <circle cx="830" cy="255" r="9" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="830" y="300" text-anchor="middle" font-size="12" fill="#1B5E20">Circuit Breakers</text>
    <text x="830" y="314" text-anchor="middle" font-size="11" fill="#757575">Sep 25</text>

    <!-- Density annotation -->
    <rect x="538" y="325" width="305" height="20" rx="4" fill="#E8F5E9"/>
    <text x="690" y="339" text-anchor="middle" font-size="11" font-weight="600" font-style="italic" fill="#2E7D32">5 defense events in 5 months (Mar - Aug 2025)</text>
  </g>

  <!-- ====== TRACK 3: Governance (orange) y=405 ====== -->
  <g id="governance">
    <rect x="2" y="390" width="72" height="30" rx="6" fill="#FF9800"/>
    <text x="38" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">Gov.</text>
    <line x1="76" y1="405" x2="1080" y2="405" stroke="#FF9800" stroke-width="2.5"/>

    <!-- EU AI Act Aug 2024 → x=420 -->
    <circle cx="420" cy="405" r="10" fill="#FFE0B2" stroke="#FF9800" stroke-width="2"/>
    <text x="420" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#E65100">EU AI Act</text>
    <text x="420" y="433" text-anchor="middle" font-size="11" fill="#757575">Aug 24</text>

    <!-- OWASP Agentic Dec 2025 → x=890 -->
    <circle cx="890" cy="405" r="10" fill="#FFE0B2" stroke="#FF9800" stroke-width="2"/>
    <text x="890" y="386" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">OWASP Agentic</text>
    <text x="890" y="433" text-anchor="middle" font-size="11" fill="#757575">Dec 25</text>

    <!-- IMDA Jan 2026 → x=990 KEY EVENT -->
    <circle cx="990" cy="405" r="14" fill="#FF9800" stroke="#E65100" stroke-width="2.5"/>
    <text x="990" y="448" text-anchor="middle" font-size="14" font-weight="800" fill="#E65100">IMDA framework</text>
    <text x="990" y="464" text-anchor="middle" font-size="12" font-weight="600" fill="#424242">Jan 2026</text>

    <!-- NIST Feb 2026 → x=1030 (text to the LEFT to avoid arc) -->
    <circle cx="1030" cy="405" r="9" fill="#FFE0B2" stroke="#FF9800" stroke-width="1.5"/>
    <text x="1030" y="386" text-anchor="middle" font-size="11" fill="#E65100">NIST Std.</text>
    <text x="1030" y="433" text-anchor="middle" font-size="11" fill="#757575">Feb 26</text>
  </g>

</svg>
